<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المكتبة المدرسية</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header><h1>📚 نظام المكتبة المدرسية</h1></header>
<main>

<section>
  <h2>الكتب</h2>
  <div class="row">
    <input id="q" placeholder="ابحث بالعنوان أو المؤلف أو التصنيف">
    <button id="searchBtn">بحث</button>
  </div>
  <div class="table"><table>
    <thead><tr><th>#</th><th>العنوان</th><th>المؤلف</th><th>التصنيف</th><th>المتاح</th></tr></thead>
    <tbody id="books"></tbody>
  </table></div>
  <p class="muted" id="count"></p>
</section>

<section>
  <h2>لوحة الإدارة</h2>
  <div class="row">
    <input id="key" type="password" placeholder="مفتاح الإدارة (ADMIN_API_KEY)" autocomplete="off">
    <button class="sec" id="unlockBtn">دخول</button>
  </div>
  <div id="msg"></div>

  <div id="admin" hidden>
    <h2>إضافة كتاب</h2>
    <div class="row">
      <input id="t" placeholder="العنوان">
      <input id="a" placeholder="المؤلف">
      <input id="c" placeholder="التصنيف">
      <input id="n" type="number" min="0" value="1" placeholder="النسخ">
      <button id="addBtn">إضافة</button>
    </div>

    <h2>استعارة كتاب</h2>
    <div class="row">
      <select id="bsel"></select>
      <select id="usel"></select>
      <input id="days" type="number" min="1" max="90" value="14">
      <button id="borrowBtn">استعارة</button>
    </div>

    <h2>الإعارات النشطة</h2>
    <div class="table"><table>
      <thead><tr><th>الكتاب</th><th>المستعير</th><th>الاستحقاق</th><th></th></tr></thead>
      <tbody id="loans"></tbody>
    </table></div>
  </div>
</section>

</main>
<script src="/app.js"></script>
</body>
</html>
